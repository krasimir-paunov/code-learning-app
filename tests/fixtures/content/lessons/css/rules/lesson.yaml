    type: visual-match
    prompt: Make the box 200px wide with 10px padding.
    html: { inline: '<div class="box">Box</div>' }
    starterCss: { inline: ".box {\n  width: 100px;\n}\n" }
    targetCss: { inline: ".box {\n  width: 200px;\n  padding: 10px;\n}\n" }
    compare:
      selectors: [.box]
    explanation: Padding adds to the width in the default content-box model.
production:
