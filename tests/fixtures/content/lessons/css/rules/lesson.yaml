# Test fixture (e2e builds only): exercises visual-match end to end.
id: css.rules
version: 1
title: Rules and declarations
summary: Fixture lesson for visual-match.
minutes: 5
concept:
  title: Fixture
  body: A fixture lesson used by end-to-end tests.
playground:
  visualizer: live-editor
  props:
    files:
      index.html: '<p>Hi</p>'
