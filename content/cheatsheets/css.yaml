track: css
title: CSS
intro: Modern CSS for layouts that work at every width.
sections:
  - id: box
    title: Box model and sizing
    entries:
      - id: css.sheet.box-sizing-reset
        title: Predictable sizing
        code: { lang: css, inline: "*,\n*::before,\n*::after {\n  box-sizing: border-box;\n}" }
        explain: Makes `width` include padding and border. Nearly every stylesheet starts with this.
        usage: daily
        learn: css.box-sizing
      - id: css.sheet.spacing-shorthand
        title: Padding and margin shorthand
        code: { lang: css, inline: ".card {\n  padding: 16px 24px; /* top-bottom, left-right */\n  margin: 0 auto 24px; /* top, left-right, bottom */\n}" }
        explain: 'One value: all sides. Two: vertical, horizontal. Three: top, horizontal, bottom. Four: clockwise from top.'
        usage: daily
        learn: css.box-model
      - id: css.sheet.visible-width
        title: How wide is it on screen?
        code: { lang: css, inline: "/* content-box (the default): */\n/* visible width = width + padding-left + padding-right\n                 + border-left + border-right */" }
        explain: Margin is outside the box and never part of its size.
        usage: common
        learn: css.box-model
      - id: css.sheet.fluid-type
        title: Fluid font size
        code: { lang: css, inline: "h1 {\n  font-size: clamp(1.75rem, 4vw + 1rem, 3rem);\n}" }
        explain: '`clamp(min, preferred, max)` grows with the viewport but never leaves the range.'
        usage: common
        learn: css.typography
  - id: layout
    title: Layout
    entries:
      - id: css.sheet.flex-center
        title: Center anything
        code: { lang: css, inline: ".center {\n  display: flex;\n  justify-content: center; /* main axis */\n  align-items: center; /* cross axis */\n}" }
        explain: 'Or, with Grid, `display: grid; place-items: center;`.'
        usage: daily
        learn: css.flex-alignment
      - id: css.sheet.flex-row
        title: A row that wraps
        code: { lang: css, inline: ".toolbar {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 8px;\n}" }
        explain: '`gap` spaces items without margins on the outer edges.'
        usage: daily
        learn: css.flex-wrap-patterns
      - id: css.sheet.grid-auto-fit
        title: Responsive card grid, no media queries
        code: { lang: css, inline: ".cards {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));\n  gap: 1rem;\n}" }
        explain: As many 16rem-or-wider columns as fit; they stretch to fill the row.
        usage: common
        learn: css.grid-auto
      - id: css.sheet.media-min-width
        title: Mobile-first breakpoint
        code: { lang: css, inline: ".sidebar {\n  display: none;\n}\n\n@media (min-width: 768px) {\n  .sidebar {\n    display: block;\n  }\n}" }
        explain: Write the small-screen style first, then add to it for wider screens.
        usage: daily
        learn: css.media-queries
  - id: theming
    title: Theming and states
    entries:
      - id: css.sheet.custom-properties
        title: Theme with variables
        code: { lang: css, inline: ":root {\n  --accent: #0b6bcb;\n}\n\n.button {\n  background: var(--accent, blue); /* fallback if undefined */\n}" }
        explain: Custom properties inherit and can be redefined in any selector, which makes themes cheap.
        usage: daily
        learn: css.custom-properties
      - id: css.sheet.focus-visible
        title: Visible keyboard focus
        code: { lang: css, inline: "button:focus-visible {\n  outline: 2px solid #0b6bcb;\n  outline-offset: 2px;\n}" }
        explain: Shows the ring for keyboard users without flashing it on every mouse click. Never remove focus styles.
        usage: daily
        learn: css.pseudo-classes
      - id: css.sheet.has
        title: Style a parent by its children
        code: { lang: css, inline: ".field:has(input:invalid) {\n  border-color: crimson;\n}" }
        explain: '`:has()` matches an element that contains something matching the inner selector.'
        usage: common
        learn: css.modern-selectors
      - id: css.sheet.reduced-motion
        title: Respect reduced motion
        code: { lang: css, inline: "@media (prefers-reduced-motion: reduce) {\n  * {\n    animation-duration: 0.01ms !important;\n    transition-duration: 0.01ms !important;\n  }\n}" }
        explain: Some people get motion sickness from animation; the OS setting tells you.
        usage: common
        learn: css.user-preferences
