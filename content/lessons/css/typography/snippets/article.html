<article>
  <h1>Ridgeline loop</h1>
  <p class="body">
    The Ridgeline loop climbs 600 metres through pine forest before it opens onto the ridge. Start
    early: the exposed section has no shade after ten, and the spring at the halfway hut can run dry
    by late summer. The descent is loose scree, so poles help.
  </p>
</article>
