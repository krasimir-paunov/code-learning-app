<div class="grid">
  <div class="wide"></div>
  <div class="full"></div>
  <div class="span"></div>
</div>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 100px);
  }
  .wide {
    grid-column: 2 / -1;
  }
  .full {
    grid-column: 1 / -1;
  }
  .span {
    grid-column: span 2;
  }
</style>
<script>
  for (const box of document.querySelectorAll('.grid div')) {
    console.log(box.offsetWidth);
  }
</script>
