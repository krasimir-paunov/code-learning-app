<div class="grid fill"><div></div><div id="a"></div></div>
<div class="grid fit"><div></div><div id="b"></div></div>
<style>
  .grid {
    display: grid;
    width: 600px;
  }
  .fill {
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  }
  .fit {
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  }
</style>
