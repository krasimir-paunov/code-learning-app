id: css.box-sizing
version: 1
title: '`box-sizing`'
summary: Make `width` mean the width you see, and know why every reset does it.
minutes: 4
tags: [box-sizing, border-box, reset, layout]

concept:
  title: Which box does `width` measure?
  body: |
    By default (`content-box`), `width` sets only the content. Padding and border are added on
    top, so a `width: 50%` column with padding is wider than half its container.

    With `box-sizing: border-box`, `width` is the **visible** width. Padding and border fit
    inside it, and the content area shrinks to make room. Two 50% columns then fill a row
    exactly, whatever their padding.

    That is why almost every stylesheet starts by switching every element, pseudo-elements
    included, to `border-box`.
  code:
    caption: The first rule of almost every stylesheet
    tabs:
      - lang: css
        file: snippets/reset.css

playground:
  visualizer: sizing-lab
  props:
    container: 320
    percent: 50
    padding: 20
    border: 2
    sizing: content-box
  prompt: |
    Two columns of `width: 50%` don't fit in their container: column B has wrapped. Switch
    `box-sizing` to `border-box`. Then drag the padding as high as you like.
  explore:
    - In `content-box`, set padding and border to 0. Do the columns fit now?
    - In `border-box`, watch how much room is left for the content as the padding grows.

challenges:
  - id: two-widths
    type: predict-output
    prompt: '`offsetWidth` is the visible width. What does this print?'
    code: { lang: html, file: snippets/predict.html }
    answer: |
      250
      200
    choices:
      - |
        250
        200
      - |
        200
        200
      - |
        250
        250
      - |
        200
        150
    verify: browser
    hints:
      - '`.a` uses the default: content + padding + border.'
      - '`.b` is `border-box`: the 200px already includes padding and border.'
    explanation: |
      `.a` is 200 + 2 × 20 + 2 × 5 = 250px on screen. `.b` is exactly 200px; its content box
      shrinks to 150px to make room.

  - id: fit-columns
    type: visual-match
    prompt: The two columns should sit side by side, each exactly half of the 300px row. Make them fit without changing the padding or the border.
    html: { file: snippets/columns.html }
    starterCss: { file: snippets/columns.starter.css }
    targetCss: { file: snippets/columns.target.css }
    compare:
      selectors: [.a, .b]
      tolerancePx: 1
    viewport: { width: 320, height: 200 }
    hints:
      - 'The padding and border are added on top of `width: 50%` right now.'
      - One property changes what `width` measures.
    explanation: '`box-sizing: border-box` keeps each column at exactly 50%, padding and border included, so both fit on one row.'

  - id: why-pseudo
    type: choice
    prompt: Why does the reset list `*::before` and `*::after` as well as `*`?
    options:
      - text: '`*` matches elements only; pseudo-elements need their own selectors.'
        correct: true
        why: Without them, generated content stays `content-box` and sizes differently from everything else.
      - text: '`box-sizing` inherits, so it is only there for clarity.'
        why: '`box-sizing` does not inherit; that is exactly why each needs it set.'
      - text: It makes the rule more specific so it wins.
        why: '`*` and pseudo-elements add almost nothing to specificity; this is about coverage.'
      - text: Older browsers required it.
        why: Every browser today still needs it; `*` has never matched pseudo-elements.
    explanation: The universal selector selects every element, but `::before` and `::after` aren't elements.

production:
  - title: Frameworks do this for you
    body: |
      Tailwind's Preflight and Bootstrap's Reboot both start with this reset. If you write CSS from
      scratch, add it first, before any other rule.
  - title: The inheriting variant
    body: |
      Some teams set `border-box` on `html` and make everything inherit it, so a third-party widget
      that expects `content-box` can switch back for its whole subtree.
    code:
      tabs:
        - lang: css
          file: snippets/inherit-reset.css

mistake:
  title: Forgetting the pseudo-elements
  body: '`* { box-sizing: border-box }` leaves every `::before` and `::after` on the old model, so decorative parts with padding come out wider than their neighbours.'
  bad:
    tabs:
      - lang: html
        file: snippets/pseudo.bad.html
        output: content-box
        verify: browser
  fix: List `*::before` and `*::after` too.
  good:
    tabs:
      - lang: html
        file: snippets/pseudo.good.html
        output: border-box
        verify: browser

recap:
  - '`content-box` (default): `width` is the content; padding and border are added on top.'
  - '`border-box`: `width` is what you see; padding and border fit inside.'
  - Start every stylesheet with the reset, pseudo-elements included.

related: [css.box-model, css.units]
