id: css.boss
version: 1
title: 'Boss: responsive landing page'
summary: Make a landing page work from phone to wide screen and add a dark theme by changing tokens only, checked at three real widths.
minutes: 10
tags: [boss, responsive, media queries, grid, custom properties, themes]

concept:
  title: One page, the whole CSS track
  body: |
    - **Mobile first**: base styles fit the narrowest screen. `min-width` queries add columns
      as space allows.
    - **Layout**: Grid for the cards, Flexbox for the header row. No fixed widths that can't
      shrink.
    - **A content width**: `max-width` with `margin-inline: auto` stops the page from
      stretching on big screens.
    - **Tokens**: every colour is a custom property. A theme is one block that redefines the
      tokens; the components never change.

    Check the page at real widths, not only on your own screen.
  code:
    caption: The skeleton of the solution
    tabs:
      - lang: css
        file: snippets/skeleton.css

playground:
  visualizer: responsive-checker
  props:
    widths: [360, 768, 1200]
    height: 560
    html: |
      <div class="site" data-theme="light">
        <header class="top">
          <a class="logo" href="#">Trailhead</a>
          <nav class="nav">
            <a href="#">Routes</a>
            <a href="#">Pricing</a>
            <a href="#">Sign in</a>
          </nav>
        </header>
        <main class="wrap">
          <section class="hero">
            <h1>Find your next trail</h1>
            <p>Routes, maps and weather for 4,000 hikes, even offline.</p>
            <a class="cta" href="#">Start free</a>
          </section>
          <section class="plans">
            <article class="plan plan-1">
              <h2>Free</h2>
              <p class="price">$0</p>
              <p>10 saved routes</p>
            </article>
            <article class="plan plan-2">
              <h2>Pro</h2>
              <p class="price">$6/mo</p>
              <p>Offline maps and unlimited routes</p>
            </article>
            <article class="plan plan-3">
              <h2>Team</h2>
              <p class="price">$20/mo</p>
              <p>Shared routes for hiking clubs</p>
            </article>
          </section>
        </main>
      </div>
    css: |
      :root {
        --bg: #ffffff;
        --surface: #f1f5f9;
        --text: #0f172a;
        --accent: #1d4ed8;
        --on-accent: #ffffff;
      }

      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      .site { min-height: 100vh; background: var(--bg); color: var(--text); }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
      }
      .logo { font-weight: 700; color: inherit; text-decoration: none; }
      .nav { display: flex; gap: 16px; }
      .nav a { color: var(--accent); }

      .wrap { padding: 16px; }
      .hero h1 { margin: 0 0 8px; font-size: 40px; line-height: 1.1; }
      .cta {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        border-radius: 6px;
        background: var(--accent);
        color: #ffffff;
        text-decoration: none;
      }

      .plans { display: flex; gap: 16px; margin-top: 32px; }
      .plan {
        flex: none;
        width: 300px;
        padding: 16px;
        border-radius: 8px;
        background: #f1f5f9;
      }
      .plan h2 { margin: 0; font-size: 20px; }
      .price { margin: 4px 0; font-size: 28px; font-weight: 700; }
    solution: |
      :root {
        --bg: #ffffff;
        --surface: #f1f5f9;
        --text: #0f172a;
        --accent: #1d4ed8;
        --on-accent: #ffffff;
      }
      [data-theme="dark"] {
        --bg: #0f172a;
        --surface: #1e293b;
        --text: #f1f5f9;
        --accent: #93c5fd;
        --on-accent: #0f172a;
      }

      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 system-ui, sans-serif; }
      .site { min-height: 100vh; background: var(--bg); color: var(--text); }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
      }
      .logo { font-weight: 700; color: inherit; text-decoration: none; }
      .nav { display: flex; gap: 16px; }
      .nav a { color: var(--accent); }

      .wrap { max-width: 1100px; margin-inline: auto; padding: 16px; }
      .hero h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 48px); line-height: 1.1; }
      .cta {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        border-radius: 6px;
        background: var(--accent);
        color: var(--on-accent);
        text-decoration: none;
      }

      .plans { display: grid; gap: 16px; margin-top: 32px; }
      .plan { padding: 16px; border-radius: 8px; background: var(--surface); }
      .plan h2 { margin: 0; font-size: 20px; }
      .price { margin: 4px 0; font-size: 28px; font-weight: 700; }

      @media (min-width: 600px) {
        .plans { grid-template-columns: repeat(2, 1fr); }
      }
      @media (min-width: 1000px) {
        .plans { grid-template-columns: repeat(3, 1fr); }
      }
    checks:
      - { kind: fits, label: Every plan stays on screen, selector: .plan-3 }
      - { kind: stacked, label: 'Phones: plans in one column', a: .plan-1, b: .plan-2, at: [360] }
      - { kind: row, label: 'Tablets: two plans per row', a: .plan-1, b: .plan-2, at: [768] }
      - {
          kind: stacked,
          label: 'Tablets: the third plan starts a new row',
          a: .plan-1,
          b: .plan-3,
          at: [768],
        }
      - {
          kind: row,
          label: 'Wide screens: three plans in a row',
          a: .plan-2,
          b: .plan-3,
          at: [1200],
        }
      - {
          kind: max-width,
          label: 'Wide screens: content at most 1100px wide',
          selector: .wrap,
          max: 1100,
          at: [1200],
        }
      - kind: style
        label: 'Page background #0f172a'
        selector: .site
        property: background-color
        value: 'rgb(15, 23, 42)'
        at: [768]
        theme: dark
      - kind: style
        label: 'Text #f1f5f9'
        selector: .site
        property: color
        value: 'rgb(241, 245, 249)'
        at: [768]
        theme: dark
      - kind: style
        label: 'Plan cards #1e293b'
        selector: .plan-1
        property: background-color
        value: 'rgb(30, 41, 59)'
        at: [768]
        theme: dark
      - kind: style
        label: 'Button text #0f172a on the light accent'
        selector: .cta
        property: color
        value: 'rgb(15, 23, 42)'
        at: [768]
        theme: dark
  prompt: |
    The page was built on a laptop. Switch the width to **360px**: the plans run off the
    screen. Edit the CSS until every check in the spec passes, at every width and in the dark
    theme.
  explore:
    - 'Which colours are written as values instead of tokens? The dark checks fail until they use `var()`.'
    - Look at the 768px view before and after your first media query. Which checks change?

challenges:
  - id: feature-grid
    type: visual-match
    prompt: |
      Match the dark feature grid at three widths: one column on phones, two from 600px, four
      from 900px, tiles 80px tall with 12px gaps. Give the dark theme its tokens: background
      `#0f172a`, tiles `#1e293b`, text `#f1f5f9`.
    html: { file: snippets/features.html }
    starterCss: { file: snippets/features.starter.css }
    targetCss: { file: snippets/features.target.css }
    compare:
      selectors: [.features, .t1, .t2, .t3, .t4]
      properties: [background-color, color]
    viewports:
      - { width: 360, height: 420 }
      - { width: 640, height: 320 }
      - { width: 960, height: 240 }
    hints:
      - 'Start with one column (`display: grid` on `.grid`), then add a `min-width` query for each step.'
      - 'The page root has `data-theme="dark"`. A `[data-theme="dark"]` block that redefines the three tokens recolours everything.'
    explanation: Grid with a mobile-first query per step handles the layout; one block of tokens handles the theme, without touching `.tile`.

  - id: token-scope
    type: predict-output
    prompt: The script prints the background of each card. What does it print?
    code: { lang: html, file: snippets/scope.html }
    answer: |
      a rgb(0, 0, 0)
      b rgb(255, 215, 0)
      c rgb(255, 255, 255)
    choices:
      - |
        a rgb(0, 0, 0)
        b rgb(255, 215, 0)
        c rgb(255, 255, 255)
      - |
        a rgb(0, 0, 0)
        b rgb(0, 0, 0)
        c rgb(0, 0, 0)
      - |
        a rgb(0, 0, 0)
        b rgb(0, 0, 0)
        c rgb(255, 255, 255)
      - |
        a rgb(255, 255, 255)
        b rgb(255, 215, 0)
        c rgb(255, 255, 255)
    verify: browser
    hints:
      - Custom properties inherit. Each card takes the value from its nearest ancestor that sets it.
      - Card C is outside the dark section.
    explanation: |
      `var(--surface)` resolves on each card from the nearest definition above it: the dark
      section for A, `.promo` for B, and `:root` for C. That is why a theme is just a block of
      tokens on a container.

  - id: breakpoint-overlap
    type: choice
    prompt: 'A stylesheet has rules in `@media (max-width: 768px)` and in `@media (min-width: 768px)`. What happens when the viewport is exactly 768px wide?'
    options:
      - text: Both queries match, so both sets of rules apply and the later ones win where they conflict.
        correct: true
        why: '`max-width` and `min-width` are inclusive, so 768 is in both ranges.'
      - text: Only the `min-width` rules apply.
        why: '`max-width: 768px` matches widths up to and including 768px.'
      - text: Neither query matches.
        why: Both ranges include their boundary.
      - text: The browser picks the query written first.
        why: Media queries don't compete; each one matches or not on its own.
    explanation: "Use one direction (mobile-first `min-width`) or range syntax such as `(width < 768px)` and `(width >= 768px)`, which don't overlap."

production:
  - title: Components that respond to their container
    body: |
      Media queries ask about the viewport. A card in a narrow sidebar needs to know its own
      space, which container queries answer (Baseline widely available). Teams use media queries
      for the page layout and container queries inside components.
    code:
      tabs:
        - lang: css
          file: snippets/container.css
  - title: Following the system theme
    body: |
      `prefers-color-scheme` sets the default theme; a `data-theme` the user picked overrides
      it. `color-scheme` tells the browser to draw form controls and scrollbars to match.
    code:
      tabs:
        - lang: css
          file: snippets/system-theme.css

mistake:
  title: Theming every component by hand
  body: |
    Overriding each component inside a dark selector doubles the CSS and breaks the first time
    someone adds a component and forgets its dark rule.
  bad:
    tabs:
      - lang: css
        file: snippets/theme.bad.css
  fix: Components read tokens; a theme redefines the tokens once.
  good:
    tabs:
      - lang: css
        file: snippets/theme.good.css

recap:
  - 'Mobile first: fit the narrow screen, then add columns with `min-width` queries.'
  - 'Cap the content width with `max-width` and `margin-inline: auto`.'
  - 'A theme is one block of tokens; components only use `var()`.'

related: [css.media-queries, css.custom-properties, css.grid-vs-flex]
