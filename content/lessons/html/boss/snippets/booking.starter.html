<div class="top">Trailhead</div>
<div class="title">Book a guided hike</div>
<form action="/book">
  <input name="name" placeholder="Your name">
  <input name="email" placeholder="Email">
  <input name="date" placeholder="Date (dd/mm/yyyy)">
  <input name="group" placeholder="People (1–8)">
  <div>Experience</div>
  <input type="radio" value="new"> New to hiking
  <input type="radio" value="regular"> Regular hiker
  <div class="btn">Book</div>
</form>
